<div class="app-shell" [class.sidebar-open]="isSidebarOpen">
  
  <!-- Mobile Overlay -->
  <div class="mobile-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar glass-sidebar">
    <div class="sidebar-header" style="gap: 10px;">
      <div class="logo-box" style="width: 32px; height: 32px; border-radius: var(--radius-sm); overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <img *ngIf="settingsService.shopLogo()" [src]="settingsService.shopLogo()" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
        <mat-icon *ngIf="!settingsService.shopLogo()" class="logo-icon">storefront</mat-icon>
      </div>
      <h2 class="brand-text" style="font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">{{ settingsService.shopName() }}</h2>
    </div>
    
    <div class="sidebar-menu">
      <mat-nav-list>
        <a mat-list-item *ngFor="let item of filteredNavItems" [routerLink]="item.route" routerLinkActive="active-nav">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <div matListItemTitle>{{ item.label }}</div>
        </a>
      </mat-nav-list>
    </div>
    
    <div class="sidebar-footer" *ngIf="currentUser">
      <div class="user-info-box">
        <div class="avatar">{{ currentUser.username.charAt(0).toUpperCase() }}</div>
        <div class="user-details">
          <span class="user-name">{{ currentUser.fullName || currentUser.username }}</span>
          <span class="user-role">{{ currentUser.roles[0] || 'User' }}</span>
        </div>
        <button mat-icon-button (click)="logout()" color="warn"><mat-icon>logout</mat-icon></button>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <main class="main-area">
    
    <!-- Header -->
    <header class="topbar glass-header">
      <button mat-icon-button class="mobile-menu-btn" (click)="toggleSidebar()"><mat-icon>menu</mat-icon></button>
      <div class="header-search">
         <mat-icon>search</mat-icon>
         <input type="text" placeholder="Search..." [ngModel]="searchService.searchQuery()" (ngModelChange)="searchService.setQuery($event)" />
       </div>
      <span class="spacer"></span>
      <div class="header-actions">
        <button mat-icon-button><mat-icon>notifications_none</mat-icon></button>
        <div class="user-profile-header">
          <div class="avatar-small">{{ currentUser?.username?.charAt(0)?.toUpperCase() }}</div>
        </div>
      </div>
    </header>

    <!-- Router Outlet -->
    <div class="content-area fade-in">
      <router-outlet></router-outlet>
    </div>
    
  </main>
</div>
