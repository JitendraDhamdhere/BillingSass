<div class="page-header">
  <div class="header-left">
    <button mat-icon-button routerLink="/categories" class="back-btn"><mat-icon>arrow_back</mat-icon></button>
    <h2>{{ isEditMode ? 'Edit' : 'New' }} Category</h2>
  </div>
</div>

<div class="form-container">
  <mat-card class="glass-card form-card">
    <mat-card-header class="form-card-header">
      <mat-card-title>Category Details</mat-card-title>
      <mat-card-subtitle>Enter the required category information below.</mat-card-subtitle>
    </mat-card-header>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card-content class="form-content">
        <div class="form-grid">
          <div class="form-group">
            <label class="custom-label">Category Name *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput formControlName="name" type="text" placeholder="Enter category name" />
              <mat-error *ngIf="form.get('name')?.hasError('required')">Category Name is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Description</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput formControlName="description" type="text" placeholder="Enter description" />
            </mat-form-field>
          </div>
        </div>
      </mat-card-content>
      <mat-card-actions align="end" class="form-actions">
        <button mat-button type="button" routerLink="/categories" class="cancel-btn">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid" class="save-btn">
          <mat-icon>save</mat-icon> Save Category
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
