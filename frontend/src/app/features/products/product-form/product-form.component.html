<div class="page-header">
  <div class="header-left">
    <button mat-icon-button routerLink="/products" class="back-btn"><mat-icon>arrow_back</mat-icon></button>
    <h2>{{ isEditMode ? 'Edit' : 'New' }} Product</h2>
  </div>
</div>
<div class="form-container">
  <mat-card class="glass-card form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card-content class="form-content">
        <div class="form-grid">
          <div class="form-group">
            <label class="custom-label">Product Code *</label>
            <mat-form-field appearance="outline" class="full-width"><input matInput formControlName="productCode" readonly /></mat-form-field>
          </div>
           <div class="form-group">
            <label class="custom-label">Product Name *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput formControlName="name" />
              <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Category *</label>
            <mat-form-field appearance="outline" class="full-width">
              <mat-select formControlName="categoryId" placeholder="Select Category">
                <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</mat-option>
              </mat-select>
              <mat-error *ngIf="form.get('categoryId')?.hasError('required')">Category is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Brand *</label>
            <mat-form-field appearance="outline" class="full-width">
              <mat-select formControlName="brandId" placeholder="Select Brand">
                <mat-option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</mat-option>
              </mat-select>
              <mat-error *ngIf="form.get('brandId')?.hasError('required')">Brand is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Unit *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput formControlName="unit" placeholder="e.g. PCS"/>
              <mat-error *ngIf="form.get('unit')?.hasError('required')">Unit is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Purchase Price *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput type="number" formControlName="purchasePrice" />
              <mat-error *ngIf="form.get('purchasePrice')?.hasError('required')">Purchase Price is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Selling Price *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput type="number" formControlName="sellingPrice" />
              <mat-error *ngIf="form.get('sellingPrice')?.hasError('required')">Selling Price is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Tax % *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput type="number" formControlName="taxPercentage" />
              <mat-error *ngIf="form.get('taxPercentage')?.hasError('required')">Tax % is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Min Stock *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput type="number" formControlName="minimumStock" />
              <mat-error *ngIf="form.get('minimumStock')?.hasError('required')">Min Stock is required</mat-error>
            </mat-form-field>
          </div>
          
          <div class="form-group" style="grid-column: span 2;">
            <label class="custom-label">Product Image</label>
            <div style="display: flex; gap: 16px; align-items: center; margin-top: 8px;">
              <div style="width: 100px; height: 100px; border-radius: var(--radius-md); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(255,255,255,0.05);">
                <img *ngIf="form.get('image')?.value" [src]="form.get('image')?.value" style="width: 100%; height: 100%; object-fit: cover;" />
                <mat-icon *ngIf="!form.get('image')?.value" style="font-size: 32px; width: 32px; height: 32px; color: var(--text-muted);">image</mat-icon>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;" />
                <button mat-flat-button color="primary" type="button" (click)="fileInput.click()">
                  <mat-icon>cloud_upload</mat-icon> Upload Image
                </button>
                <button mat-button color="warn" type="button" *ngIf="form.get('image')?.value" (click)="clearImage()">
                  <mat-icon>delete</mat-icon> Remove
                </button>
              </div>
            </div>
          </div>
        </div>
      </mat-card-content>
      <mat-card-actions align="end" class="form-actions" style="margin-top:20px; padding: 20px;">
        <button mat-button type="button" routerLink="/products">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid"><mat-icon>save</mat-icon> Save</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
