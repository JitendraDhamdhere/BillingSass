<div class="page-header">
  <div class="header-left">
    <button mat-icon-button routerLink="/brands" class="back-btn"><mat-icon>arrow_back</mat-icon></button>
    <h2>{{ isEditMode ? 'Edit' : 'New' }} Brand</h2>
  </div>
</div>
<div class="form-container">
  <mat-card class="glass-card form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card-content class="form-content">
        <div class="form-grid">
          <div class="form-group">
            <label class="custom-label">Brand Name *</label>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput formControlName="name" />
              <mat-error *ngIf="form.get('name')?.hasError('required')">Brand Name is required</mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <label class="custom-label">Description</label>
            <mat-form-field appearance="outline" class="full-width"><input matInput formControlName="description" /></mat-form-field>
          </div>
        </div>
      </mat-card-content>
      <mat-card-actions align="end" class="form-actions">
        <button mat-button type="button" routerLink="/brands">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid"><mat-icon>save</mat-icon> Save</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
